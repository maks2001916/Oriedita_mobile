allprojects {
    repositories {
        // Основное зеркало Maven Central (Китай)
        maven { url "https://maven.aliyun.com/repository/public" }

        // Зеркало Google (Китай)
        maven { url "https://maven.aliyun.com/repository/google" }

        // Зеркало Gradle Plugins (Китай)
        maven { url "https://maven.aliyun.com/repository/gradle-plugin" }

        // Зеркало JetBrains Compose (если нужно)
        maven { url "https://maven.aliyun.com/repository/jcenter" }

        // Резервные репозитории (добавьте в конец)
        mavenCentral()
        google()
        gradlePluginPortal()
    }

    buildscript {
        repositories {
            // Те же зеркала для buildscript
            maven { url "https://maven.aliyun.com/repository/public" }
            maven { url "https://maven.aliyun.com/repository/google" }
            maven { url "https://maven.aliyun.com/repository/gradle-plugin" }

            // Резервные
            mavenCentral()
            google()
        }
    }
}